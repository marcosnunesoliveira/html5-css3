<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço</title>
    <style>
        body{
            background-image: linear-gradient(to right, black, blue,black);
        }

        h1{
            text-align: center;
        }

        div#conteiner{
            position: relative;
            width: 400px;
            height: 400px;
            margin: auto;
        }

        #fundo{
            width: 100%;
            height: 100%;
        }

        #topo{
            position: absolute;
            top: 18%;
            left: 18%;
            width: 50%;
            height: 50%;
            z-index: 1;
        }
    </style>
</head>
<body>
    <h1>Espaço</h1>
    <div id="conteiner">
        <img src="imagens/espaco.jpg" id="fundo" alt="Espaço">
        <img src="imagens/astronauta.png" id="topo" alt="astronauta">
    </div>
</body>
</html>
