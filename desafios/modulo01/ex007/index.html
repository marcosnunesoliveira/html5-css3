<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo uma imagem completa? Experimente ampliar o tamanho da sua janela para ter uma experiência melhor.</p>
    <picture>
        <source media="(min-width: 1050px)" srcset="paisagem-g.png" type="image/png">
        <source media="(min-width: 750px)" srcset="paisagem-m.png" type="image/png">
        <img src="paisagem-p.png" alt="imagem-p">
    </picture>
</body>
</html>
