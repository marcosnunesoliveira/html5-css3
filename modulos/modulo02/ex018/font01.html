<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Honk:MORF@15&display=swap');

        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&display=swap');

        body{
            font-family: "Honk", system-ui;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            font-variation-settings:
            "MORF" 15,
            "SHLN" 50;
        }

        p{
            font-family: "Bitcount Single", system-ui;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quas praesentium sunt reprehenderit earum eligendi. Vel reprehenderit ea incidunt, ratione, veritatis officia recusandae consequatur omnis autem ullam, aut quidem nostrum nulla.</p>
</body>
</html>
