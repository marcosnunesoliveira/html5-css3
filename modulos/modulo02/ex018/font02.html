<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'marcos'; /*Você escolhe o nome*/
            src: url("Singsong/Singsong.otf") format('opentype');
            font-weight: normal;
            font-style: normal;

            /*Tipos de format()
                - opentype (otf)
                - truetype (ttf)
            */
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        h1{
            font-family: 'marcos', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Unde natus rerum quas sint nemo a enim mollitia aliquid. Libero maiores expedita illo repellat totam quo harum sapiente officiis ipsa eveniet.</p>
</body>
</html>
