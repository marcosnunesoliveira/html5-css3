<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 500px;
            border-collapse: collapse;
        }

        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 8px;
        }

        th, td{
            border: 1px solid black;
            padding: 8px;
        }


        tr:nth-child(even){
            background-color: gray;
        }

        .destaque{
            background-color: gray;
        }

        col.nome{
            background-color: green;
        }

        col.sexo{
            background-color: pink;
        }
    </style>
</head>
<body>
    <h1>Exercícios de Tabelas</h1>
    <table>
        <colgroup>
            <col class="nome">
            <col class="sexo" span="3">
        </colgroup>
        <caption>Cadastro</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Bruno Silva</td>
                <td>M</td>
                <td>30</td>
                <td>Engenheiro</td>
            </tr>
            <tr>
                <td>Carla Souza</td>
                <td>F</td>
                <td>28</td>
                <td>Designer</td>
            </tr>
            <tr>
                <td>Diego Santos</td>
                <td>M</td>
                <td>35</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Fernanda Lima</td>
                <td>F</td>
                <td>22</td>
                <td>Estudante</td>
            </tr>
            <tr>
                <td>Gabriel Costa</td>
                <td>M</td>
                <td>27</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Helena Alves</td>
                <td>F</td>
                <td>32</td>
                <td>Médica</td>
            </tr>
            <tr>
                <td>Igor Pereira</td>
                <td>M</td>
                <td>29</td>
                <td>Advogado</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
