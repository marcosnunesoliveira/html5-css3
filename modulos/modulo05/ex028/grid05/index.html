<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, auto);
            gap: 20px;
        }

        .item1 {
            background-color: red;
            /*grid-row: 1 / span 3;
            grid-column: 1 / span 2;*/
            grid-area: 1 / 1 / span 3 / span 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">Caixa1</div>
        <div class="item2">Caixa2</div>
        <div class="item3">Caixa3</div>
        <div class="item4">Caixa4</div>
        <div class="item5">Caixa5</div>
        <div class="item6">Caixa6</div>
        <div class="item7">Caixa7</div>
    </div>
</body>
</html>
