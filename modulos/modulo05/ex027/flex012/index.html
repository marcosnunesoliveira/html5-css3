<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            background-color: pink;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: aquamarine;
            border: 1px solid black;
            text-align: center;
        }

        #item1 {
            flex-grow: 0;
            flex-shrink: 1;
            flex-basis: 200px;
        }

        #item2 {
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 150px;
        }

        #item3 {
            /*flex-grow: 8;
            flex-shrink: 1;
            flex-basis: auto;*/

            flex: 8 1 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div id="item1" class="item">A</div>
        <div id="item2" class="item">B</div>
        <div id="item3" class="item">C</div>
    </div>
</body>
</html>
