<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Meu Formulário</h1>
    <form action="script.py" method="get" autocomplete="off">
        <p><label for="inome">Nome:</label>
             <input type="text" name="nome" id="inome" required placeholder="Nome"> </p>
        <p><label for="isobrenome">Sobrenome:</label>
             <input type="text" name="Sobrenome" id="isobrenome" required placeholder="Sobrenome"> </p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
