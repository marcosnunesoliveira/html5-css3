<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form>
        <label for="ano">Digite o ano do seu nascimento:</label>
        <input type="number" name="ano" id="iano" value="2026" oninput="idade()">

        <p>
            <label for="iidade">Idade:</label>
            <output id="saida"></output>
        </p>
    </form>

    <script>
        let atual = new Date().getFullYear()
        function idade(){
            saida.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>
</body>
</html>
